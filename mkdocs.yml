site_name: "Farris Family Recipe Book"
theme:
  name: "material"
  custom_dir: overrides
  logo: img/farrisfamrecipes.png
  favicon: img/spoon-solid.svg
  features:
    - navigation.tabs
    - navigation.top
    - navigation.path
    - navigation.indexes
    - search.suggest
    - content.footnote.tooltips
  palette:
    # Auto mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - stylesheets/home.css

# Extensions
markdown_extensions:
  - footnotes
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - meta:
      enabled: true
  - search
  - tags:
      enabled: true
      tags: true
      tags_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - Home: index.md
  - Recipes: recipes/index.md
  - Cooking Tips: tips.md
  - About: about.md